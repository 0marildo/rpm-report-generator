[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "report-agent"
version = "2.0.0"
description = "Semi-automatic Fire Safety Technical Report Generator"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.10.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "google-generativeai>=0.8.0",
    "Pillow>=10.0.0",
    "gradio>=5.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.18",
]

[project.scripts]
report-agent = "report_agent.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["report_agent*"]
